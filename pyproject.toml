[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasna"
version = "0.9.0"
description = "Jasna"
requires-python = ">=3.12"
dependencies = [
  # current_ctx support is merged upstream for PyAV 18.1.0 but is not published yet.
  # Linux releases override this with the pinned upstream-main wheel in build_linux.sh;
  # remove that override and require av>=18.1 once the release reaches PyPI.
  "av>=18,<19",
  "numpy>=1.26",
  "psutil",
  "diffusers",
  "accelerate",
  "huggingface-hub",
  "mmengine==0.10.7",
  "opencv-python<5",
  "Pillow",
  "tqdm",
  "customtkinter",
  "tkinterdnd2",
  "ultralytics",
  "onnx",
  "cryptography>=42",
]

[project.scripts]
jasna = "jasna.main:main"

[project.optional-dependencies]
nvidia = [
  "torch==2.12.0+cu130",
  "torchvision==0.27.0+cu130",
  "tensorrt==10.16.1.11",
  "torch-tensorrt==2.12.0",
  "nvidia-vfx",
  # The VALI decode backend needs the corruption-tolerant fork (~/k-drive/vali,
  # DecodeSingleSurfaceAsyncDetailed); with the stock PyPI wheel the reader
  # falls back to PyAV at open time. Release builds install the fork wheel from
  # keytool/wheels/ on top of this pin (see keytool/build_linux.sh).
  "python_vali==4.8.7",
]
amd = [
  "torch==2.9.1",
  # The ROCm channels ship different torchvision versions per OS (Linux
  # manylinux/base image: 0.24.0, Windows: 0.24.1). A shared ==0.24.1 pin is
  # unsatisfiable by any Linux ROCm wheel, so uv silently replaced torchvision
  # with the PyPI CUDA build and torchvision::nms failed to register.
  "torchvision==0.24.0; sys_platform == 'linux'",
  "torchvision==0.24.1; sys_platform == 'win32'",
  # AMD runs RF-DETR through the rfdetr torch model (ROCm), not ONNX/MIGraphX,
  # which sidesteps the Windows-only MIGraphX wheels (see issue #240).
  "rfdetr==1.8.3",
  "numpy==1.26.4",
]
dev = [
  "nuitka>=2.4",
  "pytest",
  "pytest-cov",
  "scikit-build",
  "cmake",
  "ninja",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["jasna*"]
exclude = ["jasna.protection.keytool*", "jasna.protection.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:mmengine\\.utils\\.misc",
  "ignore:`torch\\.jit\\.script` is deprecated:DeprecationWarning",
]
