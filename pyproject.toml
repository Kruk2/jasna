[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasna"
version = "0.12.3"
description = "Jasna"
requires-python = ">=3.12"
dependencies = [
  # Exact pin: the release VALI wheel is built against the same pyav-ffmpeg libraries
  # this wheel bundles, so bump both together.
  "av==18.1.0",
  "numpy>=1.26",
  "psutil",
  "diffusers",
  "huggingface-hub",
  "safetensors>=0.6",
  "requests",
  "mmengine==0.10.7",
  "opencv-python<5",
  "Pillow",
  "tqdm",
  "customtkinter==6.0.0",
  "tkinterdnd2",
  "pystray; sys_platform == 'win32'",
  "jeepney; sys_platform == 'linux'",
  "python-vlc==3.0.21203",
  # Older versions cannot reconstruct YOLO checkpoints under the release's weights-only policy.
  "ultralytics>=8.4.96,<8.5",
  # Not imported directly; ultralytics needs it to export YOLO models for TensorRT.
  "onnx",
  "cryptography>=42",
]

[project.scripts]
jasna = "jasna.main:main"

[project.optional-dependencies]
nvidia = [
  "torch==2.12.1+cu130",
  "torchvision==0.27.1+cu130",
  "tensorrt==10.16.1.11",
  "torch-tensorrt==2.12.0",
  "nvidia-vfx==0.2.0.0",
  # LTX self-attention kernel (INT8, prebuilt abi3 wheels for Linux and Windows).
  "comfy-kitchen==0.2.38",
  "scipy",
  # torch.compile and the LTX Triton kernels; Linux torch wheels bring triton 3.7.1 themselves.
  "triton-windows==3.7.1.post27; sys_platform == 'win32'",
  # The VALI decode backend needs the corruption-tolerant fork (codeberg.org/Kruk2/vali,
  # DecodeSingleSurfaceAsyncDetailed); with the stock PyPI wheel the reader
  # falls back to PyAV at open time. Release builds install the fork wheel from
  # keytool/wheels/ on top of this pin (see keytool/build_linux.sh).
  "python_vali==4.8.8",
]
amd = [
  # Exact AMD builds from stable.repo.amd.com/rocm/whl-next on both OSes.
  "torch==2.14.0+rocm10.1.0",
  "torchvision==0.29.0a0+rocm10.1.0",
  "triton-windows==3.8.0.post29; sys_platform == 'win32'",
  # AMD runs RF-DETR through the rfdetr torch model (ROCm), not ONNX/MIGraphX,
  # which sidesteps the Windows-only MIGraphX wheels (see issue #240).
  "rfdetr==1.8.3",
  # Newer transformers imports FSDP while resolving AutoBackbone, but the
  # Windows ROCm torch wheel intentionally has no distributed_c10d extension.
  "transformers==5.1.0",
  "numpy==1.26.4",
  # LTX kernels: the same wheels carry prebuilt HIP backends (Linux and Windows).
  "comfy-kitchen==0.2.38",
]
dev = [
  "nuitka>=2.4",
  "pytest",
  "pytest-cov",
  "scikit-build",
  "cmake",
  "ninja",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"jasna.media" = ["*.fatbin", "*.hipfb"]
"jasna.ltx.native" = [
  "*.cpp", "*.cu", "*.h", "*.hip",
  "sage_attention/*.cu", "sage_attention/*.cuh", "sage_attention/*.h", "sage_attention/NOTICE",
  "sage_attention_hip/*.hip", "sage_attention_hip/*.h", "sage_attention_hip/NOTICE",
]

[tool.setuptools.packages.find]
include = ["jasna*"]
exclude = ["jasna.protection.keytool*", "jasna.protection.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: takes over ten seconds; deselect with -m 'not slow'",
]
filterwarnings = [
  "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:mmengine\\.utils\\.misc",
  "ignore:`torch\\.jit\\.script` is deprecated:DeprecationWarning",
]
